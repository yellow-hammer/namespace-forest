name: Обновление XSD-схем платформы 1С

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      min_version:
        description: 'Нижняя граница версии платформы'
        required: false
        default: '8.3.17'
      only_version:
        description: 'Обработать только одну версию, например 8.3.17.2760'
        required: false
        default: ''
      redump:
        description: 'Перевыгрузить уже обработанные форматы (по старшей версии платформы каждого)'
        required: false
        type: boolean
        default: false
      batch_size:
        description: 'Максимум версий за прогон'
        required: false
        default: '15'

concurrency:
  group: update-schemas
  cancel-in-progress: false

jobs:
  update-schemas:
    name: Извлечение XSD-схем
    runs-on: ubuntu-22.04
    timeout-minutes: 340

    permissions:
      contents: write

    steps:
      - name: Checkout namespace-forest
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Установить OneScript
        uses: otymko/setup-onescript@v1.5.1
        with:
          version: stable

      - name: Установить yard
        run: |
          opm install opm
          opm install yard
          YARD_OS=$(find "$HOME/.local/share/ovm" -path '*/yard/src/yard.os' 2>/dev/null | head -1)
          if [ -z "$YARD_OS" ]; then echo "ERROR: yard.os не найден"; exit 1; fi
          echo "YARD_OS=$YARD_OS" >> "$GITHUB_ENV"

      - name: Получить список версий с releases.1c.ru
        env:
          YARD_RELEASES_USER: ${{ secrets.ONEC_LOGIN }}
          YARD_RELEASES_PWD: ${{ secrets.ONEC_PASSWORD }}
        run: |
          oscript "$YARD_OS" releases list \
            --app-filter "Технологическая платформа 8\.[35]$" \
            --output-file /tmp/yard-versions.json

      - name: Определить новые версии
        id: versions
        env:
          MIN_VERSION: ${{ inputs.min_version || '8.3.17' }}
          ONLY_VERSION: ${{ inputs.only_version || '' }}
          REDUMP: ${{ inputs.redump && 'true' || '' }}
          BATCH_SIZE: ${{ inputs.batch_size || '15' }}
        run: |
          if [ -n "$ONLY_VERSION" ]; then
            echo "$ONLY_VERSION" > /tmp/new-versions.txt
          elif [ "$REDUMP" = "true" ]; then
            PROCESSED=schemas/designer/processed-versions.json \
            OUT_FILE=/tmp/new-versions.txt \
              oscript scripts/select-processed.os
          else
            YARD_JSON=/tmp/yard-versions.json \
            PROCESSED=schemas/designer/processed-versions.json \
            MIN_VERSION="$MIN_VERSION" \
            LIMIT="$BATCH_SIZE" \
            OUT_FILE=/tmp/new-versions.txt \
              oscript scripts/select-versions.os
          fi
          VERSIONS=$(tr '\n' ' ' < /tmp/new-versions.txt)
          echo "Новые версии: $VERSIONS"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "count=$(echo $VERSIONS | wc -w)" >> "$GITHUB_OUTPUT"

      - name: Пропустить если нет новых версий
        if: steps.versions.outputs.count == '0'
        run: echo "Новых версий не найдено."

      - name: Установить зависимости платформы 1С
        if: steps.versions.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fontconfig libgsf-1-114 libglib2.0-0 libodbc1 libwebkit2gtk-4.0-37 \
            xvfb unzip curl
          LE_BASE=http://archive.ubuntu.com/ubuntu/pool/universe/e/enchant/
          LE_FILE=$(curl -s "$LE_BASE" | grep -oE 'libenchant1c2a_[^"]*_amd64\.deb' | head -1)
          curl -sL "$LE_BASE$LE_FILE" -o /tmp/libenchant.deb
          sudo apt-get install -y /tmp/libenchant.deb

      - name: Обработать версии платформы
        if: steps.versions.outputs.count != '0'
        env:
          VERSIONS: ${{ steps.versions.outputs.versions }}
          YARD_RELEASES_USER: ${{ secrets.ONEC_LOGIN }}
          YARD_RELEASES_PWD: ${{ secrets.ONEC_PASSWORD }}
        run: |
          set +e
          REPO_DIR=$(pwd)

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for PLATFORM_VERSION in $VERSIONS; do
            echo "===================== $PLATFORM_VERSION ====================="
            OUTPUT_DIR=$(mktemp -d); chmod 777 "$OUTPUT_DIR"
            DISTR_DIR=$(mktemp -d);  chmod 777 "$DISTR_DIR"

            ESCAPED_VERSION=$(echo "$PLATFORM_VERSION" | sed 's/\./\\./g')
            # Фильтры yard - регулярные выражения, поэтому точка экранируется:
            # без этого 8.3 совпадает с любым символом на месте точки.
            APP_MAJOR=$(echo "$PLATFORM_VERSION" | cut -d. -f1,2 | sed 's/\./\\./g')
            DISTR_FILTERS=(
              "[CС]ервер.+\(64-bit\) для DEB-based Linux-систем$"
              "Технологическая платформа.+\(64-bit\) для Linux$"
            )
            STEP_OK=0
            for ATTEMPT in 1 2 3; do
              for DF in "${DISTR_FILTERS[@]}"; do
                timeout 900 oscript "$YARD_OS" releases get \
                  --app-filter "Технологическая платформа $APP_MAJOR\$" \
                  --version-filter "$ESCAPED_VERSION" \
                  --distr-filter "$DF" \
                  --path "$DISTR_DIR" --download-limit 1 --extract || true
                if find "$DISTR_DIR" -type f \( -name 'setup-full*.run' -o -name '*.deb' \) | grep -q .; then
                  STEP_OK=1; break
                fi
              done
              [ "$STEP_OK" -eq 1 ] && break
              echo "Попытка $ATTEMPT — дистрибутив не получен, пауза 20с…"; sleep 20
            done
            if [ "$STEP_OK" -ne 1 ]; then
              echo "WARN: дистрибутив $PLATFORM_VERSION не скачан, пропускаем"
              rm -rf "$OUTPUT_DIR" "$DISTR_DIR"; continue
            fi

            sudo rm -rf /opt/1cv8 /opt/1C 2>/dev/null || true

            echo "Содержимое дистрибутива:"; find "$DISTR_DIR" -type f \( -name '*.run' -o -name '*.deb' \) | sed "s#$DISTR_DIR/##"
            RUN_INSTALLER=$(find "$DISTR_DIR" -name 'setup-full*.run' | head -1)
            if [ -n "$RUN_INSTALLER" ]; then
              echo "Установка через .run: $(basename "$RUN_INSTALLER")"
              chmod +x "$RUN_INSTALLER"
              for COMPONENTS in server,client_full,v8_install_deps server,client_full; do
                if timeout 900 xvfb-run -a sudo "$RUN_INSTALLER" --mode unattended \
                  --enable-components "$COMPONENTS" > /tmp/install.log 2>&1; then
                  break
                fi
                echo "Набор компонентов [$COMPONENTS] отклонён, пробую следующий…"
              done
            else
              DEBS=$(find "$DISTR_DIR" -name '*.deb' | sort)
              if [ -z "$DEBS" ]; then
                echo "ERROR: ни .run, ни .deb не найдены для $PLATFORM_VERSION"
                find "$DISTR_DIR" -type f | sed "s#$DISTR_DIR/##"
                rm -rf "$OUTPUT_DIR" "$DISTR_DIR"; continue
              fi
              echo "Установка через .deb ($(echo "$DEBS" | wc -l) пакетов)"
              timeout 600 sudo dpkg -i $DEBS > /tmp/install.log 2>&1 \
                || timeout 600 sudo apt-get install -f -y >> /tmp/install.log 2>&1 \
                || { echo "ERROR установки .deb:"; tail -30 /tmp/install.log; }
            fi

            IBCMD=$(find /opt/1cv8 /opt/1C -name 'ibcmd' -type f 2>/dev/null | sort -V | tail -1)
            IBSRV=$(find /opt/1cv8 /opt/1C -name 'ibsrv' -type f 2>/dev/null | sort -V | tail -1)
            if [ -z "$IBCMD" ] || [ -z "$IBSRV" ]; then
              echo "ERROR: ibcmd/ibsrv не найдены после установки $PLATFORM_VERSION"
              rm -rf "$OUTPUT_DIR" "$DISTR_DIR"; continue
            fi

            DB_DIR=$(mktemp -d); DATA_DIR=$(mktemp -d)
            DATA_ARG=""
            if ! timeout 300 "$IBCMD" infobase create --db-path="$DB_DIR" >/dev/null 2>&1; then
              DATA_ARG="--data=$DATA_DIR"
              timeout 300 "$IBCMD" infobase create $DATA_ARG --db-path="$DB_DIR" >/dev/null 2>&1 || true
            fi
            timeout 300 "$IBCMD" infobase config import $DATA_ARG --db-path="$DB_DIR" "$REPO_DIR/src" 2>&1 | tail -5 || true
            timeout 300 "$IBCMD" infobase config apply $DATA_ARG --db-path="$DB_DIR" --force 2>&1 | tail -5 || true

            PORT=8314
            "$IBSRV" --db-path="$DB_DIR" --data="$DATA_DIR" \
              --port=$PORT --config="$REPO_DIR/src/publication.yaml" \
              > /tmp/ibsrv.log 2>&1 &
            IBSRV_PID=$!
            for i in $(seq 1 30); do
              curl -s "http://127.0.0.1:$PORT/" >/dev/null 2>&1 && break
              sleep 2
            done

            JSON_OUT="$OUTPUT_DIR/schemas.json"
            HTTP_CODE=$(curl -s -m 120 --connect-timeout 10 -o "$JSON_OUT" -w '%{http_code}' \
              "http://127.0.0.1:$PORT/hs/xsd/dump" || echo "000")
            kill "$IBSRV_PID" 2>/dev/null || true
            echo "HTTP /hs/xsd/dump: $HTTP_CODE ($(wc -c < "$JSON_OUT" 2>/dev/null || echo 0) байт)"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: HTTP-сервис вернул $HTTP_CODE для $PLATFORM_VERSION"
              head -c 500 "$JSON_OUT" 2>/dev/null; echo; cat /tmp/ibsrv.log
              rm -rf "$OUTPUT_DIR" "$DISTR_DIR" "$DB_DIR" "$DATA_DIR"; continue
            fi

            JSON_IN="$JSON_OUT" OUT_DIR="$OUTPUT_DIR" oscript scripts/json-to-files.os
            rm -f "$JSON_OUT"

            XSD_COUNT=$(find "$OUTPUT_DIR" -name '*.xsd' | wc -l)
            if [ "$XSD_COUNT" -eq 0 ]; then
              echo "ERROR: XSD не получены для $PLATFORM_VERSION"
              rm -rf "$OUTPUT_DIR" "$DISTR_DIR" "$DB_DIR" "$DATA_DIR"; continue
            fi

            ENUMS_XSD=$(find "$OUTPUT_DIR" -name '*xcf-enums.xsd' | head -1)
            SCHEMA_VERSION=$(grep -o '<xs:enumeration value="[0-9.]*"' "$ENUMS_XSD" \
              | grep -o '"[0-9.]*"' | tr -d '"' | sort -V | tail -1)
            if [ -z "$SCHEMA_VERSION" ]; then
              echo "ERROR: FormatVersion не определён для $PLATFORM_VERSION"
              rm -rf "$OUTPUT_DIR" "$DISTR_DIR" "$DB_DIR" "$DATA_DIR"; continue
            fi
            SCHEMA_DIR="$REPO_DIR/schemas/designer/$SCHEMA_VERSION"
            mkdir -p "$SCHEMA_DIR"
            echo "Платформа $PLATFORM_VERSION → формат $SCHEMA_VERSION, $XSD_COUNT схем"
            cp "$OUTPUT_DIR"/*.xsd "$SCHEMA_DIR/"
            rm -rf "$OUTPUT_DIR" "$DISTR_DIR" "$DB_DIR" "$DATA_DIR"

            echo "$PLATFORM_VERSION $SCHEMA_VERSION" >> /tmp/processed-map.txt

            git add "schemas/designer/$SCHEMA_VERSION/"
            if git diff --cached --quiet; then
              echo "Схемы формата $SCHEMA_VERSION не изменились."
            else
              git commit -m "chore: XSD-схемы платформы 1С формата ${SCHEMA_VERSION} (из ${PLATFORM_VERSION})"
              git push origin "HEAD:$GITHUB_REF_NAME" || echo "WARN: push не прошёл, повторим в финале"
            fi
          done
          exit 0

      - name: Обновить processed-versions.json и push
        if: always() && steps.versions.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -s /tmp/processed-map.txt ]; then
            MAP_FILE=/tmp/processed-map.txt \
            PROCESSED=schemas/designer/processed-versions.json \
              oscript scripts/update-processed.os
            git add schemas/designer/processed-versions.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: обновление processed-versions.json"
            fi
          fi

          if git log "origin/$GITHUB_REF_NAME..HEAD" --oneline 2>/dev/null | grep -q .; then
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Все коммиты уже на origin."
          fi
